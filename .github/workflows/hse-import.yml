name: Import images from HSE portfolio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/hse-import.json]

permissions:
  contents: write

concurrency:
  group: hse-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Import from hsedesign.ru
        run: node scripts/import-hse.mjs
      - name: Push result to hse-import branch
        run: |
          git config user.name "portfolio-import-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B hse-import
          git add -A public/portfolio public/portfolio-thumbs app/data
          git commit -m "Импорт картинок и гифок из портфолио ВШЭ" || echo "nothing to commit"
          git push -f origin hse-import
